        promoText: 'في انتظار العيد، استعدّ 👇<ul style="margin:.5rem 0 .8rem 1.5rem;line-height:2;direction:rtl;text-align:right"><li>📖 اقرأ جزءاً من القرآن يومياً <strong>لختمه في سنة</strong> — استماع آية بآية، تجويد، صوتيات، ترجمة كلمة بكلمة، و<strong>أكبر مكتبة تفاسير وترجمات</strong></li><li>🕌 <strong>متابعة الصلوات</strong> حتى لا تفوتك صلاة أو سنّة أبداً</li><li>🤲 <strong>أذكار يومية</strong> — الصباح والمساء والمزيد</li><li>🕋 <strong>مواقيت صلاة بالموقع الجغرافي</strong> واتجاه القبلة</li><li>📶 <strong>100% بدون إنترنت</strong> — يعمل بدون اتصال</li><li>🌍 متاح بـ<strong>العربية والفرنسية والإنجليزية</strong></li></ul><div class="notify-row" style="direction:rtl"><div style="display:flex;gap:.5rem;margin:.2rem 0"><input type="text" class="notify-input" placeholder="بريدك أو حسابك" style="flex:1;padding:.42rem .7rem;font-size:.82rem;border:1.5px solid rgba(26,122,90,.3);border-radius:7px;font-family:inherit;outline:none;background:#fff;color:#1a1a1a;direction:rtl"><button class="elmoslim-notify-btn" onclick="notifyElMoslim(this)">أخبرني</button></div><p class="notify-feedback" style="display:none;font-size:.78rem;color:#1a7a5a;font-weight:700;margin-top:.4rem;text-align:right"></p></div><div style="font-size:.8rem;font-weight:700;color:#1a7a5a;margin:.9rem 0 .3rem;text-transform:uppercase;letter-spacing:.4px;direction:rtl;text-align:right">قريباً 🔜</div><ul style="margin:0 0 .8rem 1.5rem;line-height:2;opacity:.75;direction:rtl;text-align:right"><li>🎧 <strong>أكثر من 300 ألف</strong> تلاوة وأناشيد وبودكاست إسلامي</li><li>💰 حاسبة <strong>الزكاة</strong> — سهلة وشاملة</li><li>⚖️ محاكي <strong>المواريث</strong> الإسلامي</li><li>📅 <strong>التقويم الهجري</strong> مع المناسبات الإسلامية</li><li>🌙 الليالي الفضيلة — <strong>ليلة القدر</strong>، العشر الأوائل من ذي الحجة…</li><li>🔔 <strong>تذكيرات</strong> الصلاة والأذكار قابلة للتخصيص</li><li>📊 <strong>إحصاءات وتقدم</strong> — سلاسل، وقت القراءة، الصلوات المنجزة</li><li>👨‍👩‍👧 <strong>وضع العائلة</strong> — مشاركة التقد         notifyPlaceholder: 'بريدك أو حسابك',
        notifyBtn: 'أخبرني',
        notifySuccess: 'سنخبرك عند الإطلاق. بارك الله فيك 🤍',
        notifyError: 'خطأ في الشبكة، حاول مجدداً.',
        rulesTitle: 'القواعد',
        errorText: 'رابط غير صالح.<br>اطلب رابطك من المنظِّم.',
        subtitleGenerator: 'قرعة الهدايا السرية',
        labelNames: 'المشاركون — اسم في كل سطر',
        namesPlaceholder: 'فاطمة\nمريم\nيوسف\nإبراهيم',
        labelRules: 'القواعد',
        defaultRules: 'المبدأ بسيط:\nتسحب اسماً ولا تُخبر أحداً — وإلا ستفسد المفاجأة.\nاختر هدية لهذا الشخص وأحضرها يوم الحفل مع بطاقة باسم صاحبها.',
        generateBtn: 'أجرِ القرعة',
        minWarning: 'يجب أن يكون هناك 3 مشاركين على الأقل.',
        linkFor: 'رابط',
        shareBtn: 'مشاركة',
        copied: 'تم النسخ!',
        shareText: 'رابطك، ',
        copyRules: 'نسخ القواعد',
        copiedRules: 'تم النسخ!',
      }
    };

    let currentLang = 'fr';
    const defaultRulesValues = { fr: T.fr.defaultRules, en: T.en.defaultRules, ar: T.ar.defaultRules };

    function applyLang(lang) {
      const t = T[lang];
      if (!t) return;
      currentLang = lang;

      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (t[key] !== undefined) el.textContent = t[key];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const key = el.dataset.i18nHtml;
        if (t[key] !== undefined) el.innerHTML = t[key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        if (t[key] !== undefined) el.placeholder = t[key];
      });

      // Update names placeholder (multiline)
      const namesInput = document.getElementById('names-input');
      if (namesInput) namesInput.placeholder = t.namesPlaceholder;

      // Update rules textarea only if it still contains a default value
      const rulesInput = document.getElementById('rules-input');
      if (rulesInput) {
        const isDefault = Object.values(defaultRulesValues).includes(rulesInput.value);
        if (isDefault || rulesInput.value === '') rulesInput.value = t.defaultRules;
      }

      // Update rules title (innerHTML replacement removes data-i18n)
      const rulesH3 = document.querySelector('.rules h3');
      if (rulesH3) rulesH3.textContent = t.rulesTitle;

      // Update share buttons in generated list
      document.querySelectorAll('.share-btn:not(.copied)').forEach(btn => {
        btn.textContent = t.shareBtn;
      });

      // Update lang buttons
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      // Persist
      localStorage.setItem('aid-secret-lang', lang);
      const url = new URL(window.location);
      url.searchParams.set('lang', lang);
      history.replaceState(null, '', url);
    }

    function setLang(lang) { applyLang(lang); }

    // Lang switcher buttons
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => setLang(btn.dataset.lang));
    });

    // Detect lang
    const params = new URLSearchParams(window.location.search);
    const langParam = params.get('lang');
    const savedLang = localStorage.getItem('aid-secret-lang');
    const initLang = (T[langParam] ? langParam : null) || (T[savedLang] ? savedLang : null) || 'fr';
    applyLang(initLang);

    // ── App logic ──────────────────────────────────────────────

    function notifyElMoslim(btn) {
      const row = btn.closest('.notify-row');
      const input = row.querySelector('.notify-input');
      const fb = row.querySelector('.notify-feedback');
      const contact = input.value.trim();
      if (!contact) { input.style.borderColor = '#e07a5f'; input.focus(); return; }
      input.style.borderColor = '';
      btn.disabled = true;
      input.disabled = true;
      btn.textContent = '…';
      const webhook = 'https://discord.com/api/webhooks/1471744286587617376/n8obXKYi1lXKUKepFAejyiXjBOgOv4buCUvQD1j1Eai2kGOIwsErk1E7BqDrsZBiiYwz';
      fetch(webhook, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: '🐑 **ElMoslim — Notification El Aid El Secret**\n📬 `' + contact + '`' })
      }).then(res => {
        if (!res.ok) res.text().then(t => console.error('Webhook error', res.status, t));
        document.querySelectorAll('#elmoslim-promo-box .notify-input, #elmoslim-promo-box .elmoslim-notify-btn').forEach(el => { el.disabled = true; });
        document.querySelectorAll('#elmoslim-promo-box .elmoslim-notify-btn').forEach(b => { b.classList.add('done'); b.textContent = '✓ ' + T[currentLang].notifyBtn; });
        document.querySelectorAll('#elmoslim-promo-box .notify-feedback').forEach(f => { f.style.color = '#1a7a5a'; f.textContent = T[currentLang].notifySuccess; f.style.display = 'block'; });
      }).catch(err => {
        console.error('Webhook failed', err);
        btn.disabled = false;
        input.disabled = false;
        btn.textContent = T[currentLang].notifyBtn;
        fb.textContent = T[currentLang].notifyError;
        fb.style.color = '#e07a5f';
        fb.style.display = 'block';
      });
    }

    // Encode name (+ optional rules separated by \0) into a hex XOR token
    function encode(name, rules) {
      const payload = rules ? name + '\0' + rules : name;
      const bytes = new TextEncoder().encode(payload);
      const key = crypto.getRandomValues(new Uint8Array(bytes.length));
      const encrypted = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) encrypted[i] = bytes[i] ^ key[i];
      const toHex = (arr) => Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
      return toHex(key) + '.' + toHex(encrypted);
    }

    function decode(code) {
      try {
        const [keyHex, dataHex] = code.split('.');
        const fromHex = (h) => new Uint8Array(h.match(/.{2}/g).map(b => parseInt(b, 16)));
        const key = fromHex(keyHex);
        const data = fromHex(dataHex);
        const decrypted = new Uint8Array(data.length);
        for (let i = 0; i < data.length; i++) decrypted[i] = data[i] ^ key[i];
        const payload = new TextDecoder().decode(decrypted);
        const sep = payload.indexOf('\0');
        if (sep === -1) return { name: payload, rules: null };
        return { name: payload.slice(0, sep), rules: payload.slice(sep + 1) };
      } catch { return null; }
    }

    const code = params.get('p');

    if (code) {
      const decoded = decode(code);
      if (decoded) {
        const { name, rules } = decoded;
        document.getElementById('participant').classList.remove('hidden');
        if (rules) {
          const rulesDiv = document.querySelector('.rules');
          const h3 = document.createElement('h3');
          h3.textContent = T[currentLang].rulesTitle;
          rulesDiv.innerHTML = '';
          rulesDiv.appendChild(h3);
          rules.split('\n').filter(Boolean).forEach(line => {
            const p = document.createElement('p');
            p.textContent = line;
            rulesDiv.appendChild(p);
          });
          rulesDiv.classList.remove('hidden');
        }
        document.getElementById('reveal-btn').addEventListener('click', function () {
          this.classList.add('hidden');
          document.getElementById('name').textContent = name;
          document.getElementById('name-box').classList.remove('hidden');
          document.getElementById('elmoslim-promo-box').classList.remove('hidden');
          const hint = document.getElementById('scroll-hint');
          const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { hint.style.display = 'none'; obs.disconnect(); } }, { threshold: 0.5 });
          obs.observe(document.getElementById('elmoslim-promo-box'));
        });
      } else {
        document.getElementById('error').classList.remove('hidden');
      }
    } else {
      document.getElementById('generator').classList.remove('hidden');

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function drawCircle(names) {
        const shuffled = shuffle(names);
        const assignments = {};
        for (let i = 0; i < shuffled.length; i++) assignments[shuffled[i]] = shuffled[(i + 1) % shuffled.length];
        return assignments;
      }

      document.getElementById('generate-btn').addEventListener('click', function () {
        const raw = document.getElementById('names-input').value.trim();
        if (!raw) return;
        const names = raw.split('\n').map(n => n.trim()).filter(Boolean);
        const warning = document.getElementById('min-warning');
        if (names.length < 3) { warning.classList.remove('hidden'); return; }
        warning.classList.add('hidden');

        const t = T[currentLang];
        const assignments = drawCircle(names);
        const output = document.getElementById('links-output');
        const baseUrl = window.location.origin + window.location.pathname;
        const customRules = document.getElementById('rules-input').value.trim();

        // Show rules block for organizer
        if (customRules) {
          document.getElementById('rules-preview').textContent = customRules;
          const copyBtn = document.getElementById('copy-rules-btn');
          copyBtn.textContent = T[currentLang].copyRules;
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(customRules).then(() => {
              copyBtn.textContent = T[currentLang].copiedRules;
              setTimeout(() => { copyBtn.textContent = T[currentLang].copyRules; }, 2000);
            });
          };
          document.getElementById('rules-output').classList.remove('hidden');
        }

        output.innerHTML = '';

        names.forEach(giver => {
          const receiver = assignments[giver];
          const encoded = encode(receiver, customRules);
          const url = baseUrl + '?p=' + encoded;
          const div = document.createElement('div');
          div.className = 'link-item';
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.textContent = url;
          const shareBtn = document.createElement('button');
          shareBtn.className = 'share-btn';
          shareBtn.dataset.url = url;
          shareBtn.dataset.name = giver;
          shareBtn.textContent = t.shareBtn;
          const footer = document.createElement('div');
          footer.className = 'link-item-footer';
          footer.appendChild(a);
          footer.appendChild(shareBtn);
          const strong = document.createElement('strong');
          strong.textContent = t.linkFor + ' ' + giver;
          div.appendChild(strong);
          div.appendChild(footer);
          output.appendChild(div);
        });
        output.classList.remove('hidden');
        output.scrollIntoView({ behavior: 'smooth', block: 'start' });

        output.addEventListener('click', function(e) {
          const btn = e.target.closest('.share-btn');
          if (!btn) return;
          const url = btn.dataset.url;
          const name = btn.dataset.name;
          const t = T[currentLang];
          if (navigator.share) {
            navigator.share({ title: 'El Aid El Secret', text: t.shareText + name + ' !', url });
          } else {
            navigator.clipboard.writeText(url).then(() => {
              btn.textContent = t.copied;
              btn.classList.add('copied');
              setTimeout(() => { btn.textContent = t.shareBtn; btn.classList.remove('copied'); }, 2000);
            });
          }
        });
      });
    }
  </script>
